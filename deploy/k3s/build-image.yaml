# lily-observer 이미지를 클러스터 안에서 빌드해 ECR 에 올리는 일회성 Job (lily-builder 와 같은 방식).
# - GitHub main 을 Kaniko 가 받아 Dockerfile 로 빌드 → <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/lily-observer:latest
# - ECR 인증은 lily-builds 의 ecr-pull Secret (ecr-credentials CronJob 이 6시간마다 갱신)
# - private 레포라 GitHub 토큰 Secret 이 필요하다. 빌드가 끝나면 지운다
#     sudo kubectl -n lily-builds create secret generic lily-observer-git \
#       --from-literal=GIT_USERNAME=x-access-token --from-literal=GIT_PASSWORD=<GitHub 토큰>
# - ECR 에 lily-observer 저장소가 먼저 있어야 한다 (콘솔에서 생성)
# - 다시 빌드하려면 Job 을 지우고 다시 apply: sudo kubectl -n lily-builds delete job lily-observer-build
apiVersion: batch/v1
kind: Job
metadata:
  name: lily-observer-build
  namespace: lily-builds
  labels:
    app.kubernetes.io/name: lily-observer-build
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lily-observer-build
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=git://github.com/SoftBank-team-lily/lily-observer.git#refs/heads/main
            - --dockerfile=Dockerfile
            - --destination=<ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/lily-observer:latest
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lily-observer-git
                  key: GIT_USERNAME
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lily-observer-git
                  key: GIT_PASSWORD
          volumeMounts:
            - name: docker-config
              mountPath: /kaniko/.docker
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: docker-config
          secret:
            secretName: ecr-pull
            items:
              - key: .dockerconfigjson
                path: config.json
