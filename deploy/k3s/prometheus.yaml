# 앱 요청 지표를 모으는 Prometheus.
# - 모든 앱 요청은 ingress-nginx 를 지나간다. 그 입구에서 앱별 요청 수 · 응답 코드 · 응답 시간을 센다
#   앱 언어 · 프레임워크와 상관없이 같은 숫자를 얻는다 (앱에 /actuator/prometheus 가 없어도 된다)
# - 전제: ingress-nginx 실행 옵션에 --enable-metrics=true (v1.12 부터 기본값이 꺼짐, README 참고)
# - lily-observer 가 여기에 "lily-test 최근 1분 5xx 비율" 같은 질문을 한다 (http://prometheus.lily-system.svc:9090)
# - 판정에는 최근 몇 분만 필요하므로 보관은 1일, 디스크 대신 emptyDir (재시작하면 비워진다)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: lily-system
---
# 어떤 파드가 떠 있는지 조회만 한다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lily-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lily-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: lily-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lily-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lily-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      # ingress-nginx 컨트롤러의 :10254/metrics
      # 매니페스트에 10254 포트가 선언돼 있지 않아서, 파드를 찾은 뒤 주소를 {파드 IP}:10254 로 바꾼다
      - job_name: ingress-nginx
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ingress-nginx]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: controller
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          # 컨테이너 포트(80, 443, 8443)마다 대상이 생기므로 하나만 남긴다
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "80"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:10254
            target_label: __address__
        # 지표 자체의 namespace · ingress 라벨(앱 쪽 값)을 덮어쓰지 않도록 대상 라벨은 붙이지 않는다
        metric_relabel_configs:
          # 판정 · 대시보드에 쓰는 것만 남긴다 (저장 공간 절약)
          - source_labels: [__name__]
            regex: nginx_ingress_controller_(requests|request_duration_seconds_(count|sum|bucket)|response_size_sum)
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lily-system
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lily-system
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
